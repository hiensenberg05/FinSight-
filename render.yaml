# FinSight Render Blueprint Specification
# Deploy all services (Managed PostgreSQL, FastAPI Backend, React Static Site) with one click
version: "1"

databases:
  - name: finsight-db
    databaseName: finsight
    user: finsight_user
    plan: free
    region: oregon # or singapore / frankfurt

services:
  # ========================================================
  # FinSight AI & Voice Gateway Service
  # ========================================================
  - type: web
    name: finsight-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter # or free (starter recommended for Playwright headless browser & audio processing)
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: finsight-db
          property: connectionString
      - key: GNANI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_USER_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        value: C09M5ETUMPF
      - key: SLACK_CHANNEL_NAME
        value: "#engineering-inventory-tracker"
      - key: SECRET_KEY
        generateValue: true

  # ========================================================
  # FinSight Responsive Dashboard Static Site
  # ========================================================
  - type: web
    name: finsight-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://finsight-api.onrender.com/api/v1
      - key: VITE_WS_URL
        value: wss://finsight-api.onrender.com/ws/voice
