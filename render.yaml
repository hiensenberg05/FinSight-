# FinSight Render Blueprint Specification
# Deploys Unified Full-Stack Service (React SPA + FastAPI Backend + Voice WebSockets + Playwright)
version: "1"

services:
  - type: web
    name: finsight-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # starter recommended for Playwright headless browser; free works for testing
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: GNANI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_USER_TOKEN
        sync: false
      - key: SLACK_CHANNEL_ID
        value: C09M5ETUMPF
      - key: SLACK_CHANNEL_NAME
        value: "#engineering-inventory-tracker"
      - key: SECRET_KEY
        generateValue: true
