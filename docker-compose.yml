version: '3.8'

services:
  # ========================================================
  # FinSight Unified Engine (Frontend + Backend + WebSockets)
  # ========================================================
  finsight:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsight-app
    restart: unless-stopped
    environment:
      PORT: 8000
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: sqlite+aiosqlite:///./finsight.db
      GNANI_API_KEY: ${GNANI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_USER_TOKEN: ${SLACK_USER_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-C09M5ETUMPF}
      SLACK_CHANNEL_NAME: ${SLACK_CHANNEL_NAME:-#engineering-inventory-tracker}
      SECRET_KEY: ${SECRET_KEY:-finsight_production_super_secret_jwt_key_change_me}
    ports:
      - "8000:8000"
      - "80:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - finsight_data:/app

volumes:
  finsight_data:
    driver: local
